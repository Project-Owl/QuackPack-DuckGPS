name=QuackPack-DuckGPS
version=1.1.0
author=Brenton Poke
maintainer=OWL Integrations <support@owlintegrations.com>
sentence=GPS handling class for ClusterDuck Protocol
paragraph=This QuackPack reads NMEA from a GPS module on an ESP32 UART with TinyGPS++, without blocking the Duck's loop. It detects the module's baud rate, configures u-blox receivers (NEO-6M, NEO-7M, NEO-8M and similar) and builds the GPS payload for the ClusterDuck Protocol gps topic. It needs a ClusterDuck Protocol project, which provides the board pins and logging.
category=Communication
url=https://github.com/Project-Owl/QuackPack-DuckGPS.git
architectures=esp32
includes=DuckGPS.h
depends=TinyGPSPlus
