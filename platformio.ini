; PlatformIO project that builds examples/BasicDuckFirmware against this
; checkout of the QuackPack. CI runs `pio run` here.
;
; A Duck firmware project that uses the QuackPack does not copy this file: it
; adds QuackPack-DuckGPS (pinned by commit) and its own CDP pin to lib_deps.
; See README.md.

[platformio]
description = QuackPack-DuckGPS example
src_dir = examples/BasicDuckFirmware/src
default_envs = lilygo_t_beam_sx1262

[env]
; Same platform as the DMS builder (espressif32 7.0.1, Arduino core 2.0.17)
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_ldf_mode = chain
lib_deps =
    ; this checkout of the QuackPack
    QuackPack-DuckGPS = symlink://.
    ; CDP 5.5 (Project-Owl release/5.5), pinned by commit like the DMS builds.
    ClusterDuck-Protocol = https://github.com/Project-Owl/ClusterDuck-Protocol.git#0f47693450c948f6a3d9426a6077456560b9c838
    ; only the example uses it, to power the GPS on a T-Beam v1.2
    lewisxhe/XPowersLib@^0.3.0
build_flags =
    -std=gnu++2a
    -Wno-inconsistent-missing-override
    -Wno-missing-field-initializers
    -Wno-format
    -D CDP_INFO
build_unflags =
    -std=gnu++11

[env:lilygo_t_beam_sx1262]
board = ttgo-t-beam
board_build.partitions = no_ota.csv
