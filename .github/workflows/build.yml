# Builds examples/BasicDuckFirmware with PlatformIO against the pinned CDP 5.5,
# so a change that breaks the library or the example fails before it is tagged.
name: Build example

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Install PlatformIO
        # Same PlatformIO Core as the DMS builder image
        run: pip install platformio==6.1.19

      - name: Build the example
        run: pio run
